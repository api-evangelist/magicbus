name: MagicBus
description: 'MagicBus is a vanpool management platform that helps employers, HR teams,
  fleet managers, and transit agencies rebuild and operate employee commuting programs.
  Through its MagicRide app, riders, drivers, and coordinators book seats, form dynamic
  on-demand vanpools, and crowdsource new routes, while reporting dashboards supply
  the data needed for program evaluation and transit-subsidy applications. Surfaced
  as a mobility portfolio lead of Version One Ventures and Y Combinator, MagicBus
  publishes no public API or developer program at this time; this profile captures
  its verified public web surface.'
